<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>


<body class="bg-light">

    <div class="container mt-5">
        <h2 class="mb-4">Admin Dashboard</h2>

        <div class="row">


            <div class="col-md-3 mb-3">
                <a href="{{ url_for('admin.manage_treks') }}" class="text-decoration-none">
                    <div class="card text-white bg-primary h-100">
                        <div class="card-body">
                            <h5 class="card-title">Total Treks</h5>
                            <h2 class="dispaly-4">{{ treks_count }}</h2>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-3 mb-3">
                <div class="card text-white bg-success h-100">
                    <div class="card-body">
                        <h5 class="card-title">Total Trekkers</h5>
                        <h2 class="dispaly-4">{{ users_count }}</h2>
                    </div>
                </div>
            </div>

            <div class="col-md-3 mb-3">
                <div class="card text-white bg-warning h-100">
                    <div class="card-body">
                        <h5 class="card-title">Total Staff</h5>
                        <h2 class="dispaly-4">{{ staff_count }}</h2>
                    </div>
                </div>
            </div>

            <div class="col-md-3 mb-3">
                <div class="card text-white bg-danger h-100">
                    <div class="card-body">
                        <h5 class="card-title">Total Bookings</h5>
                        <h2 class="dispaly-4">{{ bookings_count }}</h2>
                    </div>
                </div>
            </div>


        </div>
    </div>

    
</body>
</html>
