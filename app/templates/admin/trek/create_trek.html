{% extends "base.html" %}

{% block title %} Adding New Trek {% endblock %}

{% block content %}

    <h2>Create New Trek</h2>
    <hr>
    
    <form action="{{ url_for('admin.edit_trek', trek_id=trek.id) if trek else url_for('admin.create_trek') }}" method="POST">
        
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Trek Name</label>
                <input type="text" name="trek_name" class="form-control" value="{{ trek.trek_name if trek else '' }}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Location</label>
                <input type="text" name="location" class="form-control" value="{{ trek.location if trek else '' }}" required>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-4">
                <label class="form-label">Difficulty</label>
                <select name="difficulty" class="form-select" required>
                    <option value="Easy" {% if trek and trek.difficulty == 'Easy' %} selected {% endif %}>Easy</option>
                    <option value="Moderate" {% if trek and trek.difficulty == 'Moderate' %} selected {% endif %}>Moderate</option>
                    <option value="Hard" {% if trek and trek.difficulty == 'Hard' %} selected {% endif %}>Hard</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Available Slots</label>
                <input type="number" name="available_slots" class="form-control" min="0" value="{{ trek.available_slots if trek else '' }}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Status</label>
                <select name="status" class="form-select" required>
                    <option value="Upcoming" {% if trek and trek.status == 'Upcoming' %} selected {% endif %}>Upcoming</option>
                    <option value="Active" {% if trek and trek.status == 'Active' %} selected {% endif %}>Active</option>
                    <option value="Completed" {% if trek and trek.status == 'Completed' %} selected {% endif %}>Completed</option>
                </select>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Start Date</label>
                <input type="date" name="start_date" class="form-control" value="{{ trek.start_date.strftime('%Y-%m-%d') if trek else '' }}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">End Date</label>
                <input type="date" name="end_date" class="form-control" value="{{ trek.end_date.strftime('%Y-%m-%d') if trek else '' }}" required>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-12">
                <label class="form-label">Assign Staff (Trek Leader)</label>
                <select name="assigned_staff_id" class="form-select" required>
                    <option value="" disabled selected>Select a staff member...</option>
                    {% for staff in staff_members %}
                        <option value="{{ staff.id }}" {% if trek and trek.assigned_staff_id == staff.id %} selected {% endif %}>{{ staff.name }} (ID: {{ staff.id }})</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <button type="submit" class="btn btn-success">{{ 'Update trek' if trek else 'Create Trek' }}</button>
        <a href="{{ url_for('admin.manage_treks') }}" class="btn btn-secondary">Cancel</a>
    </form>

{% endblock %}
