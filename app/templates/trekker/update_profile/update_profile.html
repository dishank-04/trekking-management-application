{% extends "base.html" %}

{% block title %} Update Profile {% endblock %}

{% block content %}

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white py-3">
                    <h4 class="mb-0">Manage Profile</h4>
                </div>
                
                <div class="card-body p-4">
                    <form action="{{ url_for('trekker.update_profile') }}" method="POST">
                        
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Username (Locked)</label>
                            <input type="text" class="form-control bg-light" value="{{ user.username }}" disabled>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Full Name</label>
                            <input type="text" name="name" class="form-control" value="{{ user.name }}" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Email Address</label>
                            <input type="email" name="email" class="form-control" value="{{ user.email }}">
                        </div>
                        
                        <hr class="mb-4">
                        
                        <div class="alert alert-info small">
                            Leave the password field blank if you do not want to change it.
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label fw-bold">Old Password</label>
                            <input type="password" name="old_password" class="form-control" minlength="6" placeholder="Enter old password">
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">New Password</label>
                            <input type="password" name="new_password" class="form-control" minlength="6" placeholder="Enter new password">
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('trekker.trekker_dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-warning fw-bold">Update Profile</button>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>


{% endblock %}
